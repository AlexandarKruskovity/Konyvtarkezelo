<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtárkezelő</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Könyvtárkezelő</h1>
        <div class="input">
            <h2>Új könyvfelvétele</h2>
            <p><input type="text" placeholder="Cím" id="cimInput"></p>
            <p><input type="text" placeholder="Szerző" id="szerzoInput"></p>
            <p><input type="text" placeholder="Kiadási év" id="evInput"></p>
            <p><input type="text" placeholder="Oldalszám" id="oldalInput"></p>
            <p><input type="text" placeholder="Kategória" id="kategoriaInput"></p>
            <p><button class="gomb" id="hozzaadasGomb">Könyv hozzáadása</button></p>
        </div>
   
    <p></p>
    
    <div id="gombok">
    <p>
        <h2>Szűrés</h2>
        <button  class="gomb" id="osszesKonyv">Összes Könyv</button>
        <button class="gomb" id="szabadKonyvek">Szabad Könyvek</button>
        <button class="gomb" id="legregebbiKonyv">Legrégebbi Könyv</button>
        <button class="gomb" id="legvastagabbKonyv">Legvastagabb Könyv</button>
        <button class="gomb" id="atlagosOldalszam">Átlagos Oldalszám</button>
    </p>
<h2>Könyvtárad</h2>
</div>

    <table class="book-table" aria-label="Könyvtárkezelés"
        style="width: 80%; margin: auto; border-collapse: collapse; border: 1px solid #ccc;">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kiadási év</th>
                <th>Oldalak</th>
                <th>Kategória</th>
                <th>Kölcsönözve</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody class="book-table-body" id="book-table-body">


        </tbody>
    </table>

    







    <script src="script.js"></script>
</body>

</html>
